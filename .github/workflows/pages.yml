# Publie l'app sur GitHub Pages (seul le code est publié, jamais vos données).
# Activer une fois : Settings › Pages › Source : « GitHub Actions ».
name: Déployer sur GitHub Pages
on:
  push:
    branches: [main, claude/local-budget-app-2rlar5]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site (sans les exemples ni les outils)
        run: |
          mkdir _site
          cp index.html app.js parsers.js period.js insights.js fx.js exchange.js bank.js sw.js manifest.webmanifest icon.svg icon-180.png icon-512.png privacy.html terms.html _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
